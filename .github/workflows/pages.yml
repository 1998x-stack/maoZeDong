name: Publish Shijing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/**"
      - "research/**"
      - "reports/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify content and generated entry
        run: |
          node scripts/inventory-legacy.mjs --check
          node scripts/build-research.mjs --check
          node scripts/validate-content.mjs
          node scripts/build-site.mjs
          git diff --exit-code -- index.html
      - name: Build curated Pages site
        run: node scripts/build-pages.mjs
      - name: Validate relative links
        run: node scripts/check-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
